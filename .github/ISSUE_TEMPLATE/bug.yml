name: Bug
description: Report a reproducible Studentory defect.
title: "[Bug]: "
labels:
  - "type:bug"
body:
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Explain which user or developer task is blocked or incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use the smallest reliable sequence. Remove personal data and secrets.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - cross-stack
        - backend
        - frontend
        - ops
        - unknown
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include version, browser, viewport, and relevant environment details.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add sanitized logs, screenshots, network errors, or failing test output.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets and personal data from this report and its attachments.
          required: true
